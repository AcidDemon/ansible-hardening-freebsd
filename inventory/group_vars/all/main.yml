---
management_cidrs: ["10.0.0.0/8"]
ssh_port: 22
ssh_allow_groups: [sshusers]
admin_user: acid
deploy_user: ansible
# at(1) dead-man's-switch reverts the SSH drop-ins if we lose the session.
harden_safe_rollback: true
harden_rollback_minutes: 20
# 2FA is deployed, but deploy_user stays key-only.
ssh_2fa_totp_enabled: true
ssh_2fa_fido2_enabled: true
