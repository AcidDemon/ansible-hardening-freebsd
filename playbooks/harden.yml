---
# Runs after acidnetworks.base_freebsd, which owns OS identity, pf, time, users and updates.
# The at(1) rollback is armed around each SSH cutover, not around the play. The roles between
# the two touch neither sshd nor PAM, and the rollback could not undo them anyway (it never
# touches pf), so they run unarmed. That keeps the slow work (crowdsec's hub, a first run's
# aide --init) out of both windows, so harden_rollback_minutes can stay short.
- name: Harden the FreeBSD host
  hosts: hardened_hosts
  become: true
  gather_facts: true
  collections:
    - acidnetworks.hardening_freebsd
  pre_tasks:
    - name: Arm the dead-man's-switch before the first cutover
      ansible.builtin.include_tasks: tasks/arm_rollback.yml
      when: harden_safe_rollback | default(true) | bool
  tasks:
    - name: First cutover, ssh_hardening (disarm always runs if we stay reachable)
      block:
        - name: Apply accounts role
          ansible.builtin.import_role: { name: accounts }

        - name: Apply ssh_hardening role
          ansible.builtin.import_role: { name: ssh_hardening }
        - name: Verify connectivity after ssh_hardening
          ansible.builtin.include_tasks: tasks/verify_conn.yml
      always:
        - name: Disarm the dead-man's-switch
          ansible.builtin.include_tasks: tasks/disarm_rollback.yml
          when: harden_safe_rollback | default(true) | bool

    - name: Apply crowdsec role
      ansible.builtin.import_role: { name: crowdsec }
    - name: Apply sshguard role
      ansible.builtin.import_role: { name: sshguard }
    - name: Apply sysctl_hardening role
      ansible.builtin.import_role: { name: sysctl_hardening }
    - name: Apply auditd role
      ansible.builtin.import_role: { name: auditd }
    - name: Apply aide role
      ansible.builtin.import_role: { name: aide }
    - name: Apply lynis role
      ansible.builtin.import_role: { name: lynis }
    - name: Apply hardening_misc role
      ansible.builtin.import_role: { name: hardening_misc }
    - name: Apply rootkit_scanners role
      ansible.builtin.import_role: { name: rootkit_scanners }
    - name: Apply security_reporting role
      ansible.builtin.import_role: { name: security_reporting }
    # Fire these roles' handlers now, unarmed. Left queued, they would run at the next flush
    # inside the 2FA window, ahead of Reload sshd, and a failing one would leave that reload undone.
    - name: Run the non-SSH handlers before the 2FA window opens
      ansible.builtin.meta: flush_handlers

    # Outside the block below, so a failed arm never reaches its disarm, which would check the
    # first window's spent job id and report a rollback that did not happen.
    - name: Arm the dead-man's-switch again for the 2FA cutover
      ansible.builtin.include_tasks: tasks/arm_rollback.yml
      when: harden_safe_rollback | default(true) | bool
    - name: Second cutover, ssh_2fa (disarm always runs if we stay reachable)
      block:
        - name: Apply ssh_2fa role
          ansible.builtin.import_role: { name: ssh_2fa }
        - name: Verify connectivity after ssh_2fa
          ansible.builtin.include_tasks: tasks/verify_conn.yml
      always:
        - name: Disarm the dead-man's-switch
          ansible.builtin.include_tasks: tasks/disarm_rollback.yml
          when: harden_safe_rollback | default(true) | bool
