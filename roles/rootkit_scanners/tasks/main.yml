---
- name: Configure chkrootkit
  when: chkrootkit_enabled | bool
  block:
    - name: Install chkrootkit
      community.general.pkgng:
        name: chkrootkit
        state: present

    # The port ships no periodic script (security/chkrootkit installs sbin/ and
    # docs only), so nothing ever read daily_chkrootkit_enable. Same hook as 510.aide.
    - name: Deploy the daily periodic chkrootkit check
      ansible.builtin.template:
        src: 530.chkrootkit.j2
        dest: /usr/local/etc/periodic/security/530.chkrootkit
        owner: root
        group: wheel
        mode: "0755"
        validate: "/bin/sh -n %s"
