---
# Set false where these sysctls are read-only (e.g. a jail).
sysctl_hardening_enabled: true
sysctl_hardening_settings:
  security.bsd.hardlink_check_uid: "1"
  security.bsd.hardlink_check_gid: "1"
  # Hide processes running inside jails from the host's unprivileged users.
  # Matters most on a jail host, where it is otherwise 1 by default.
  security.bsd.see_jail_proc: "0"
  # net.inet.ip.check_interface no longer exists: FreeBSD 14 renamed it
  # rfc1122_strong_es (src 94df3271d6b2). Not set under either name. It checks
  # that a packet's destination address belongs to the interface it arrived
  # on, which says nothing about a forged source, and the kernel ignores it
  # whenever net.inet.ip.forwarding is on (any routed-epair jail host). Forged
  # sources are pf's job, and base's pf.conf has no antispoof rule: base_freebsd
  # binds its management and service rules to an interface instead, once
  # firewall_tier_iifnames is set.
  #
  # kern.randompid is handled separately below, not here: the kernel replaces the
  # value you write with a random modulus of its own, so writing 1 reads back as
  # something like 1123 and this dict would report changed on every run.
  #
  # security.bsd.allow_destructive_dtrace is deliberately absent. The MIB only
  # exists once the dtrace modules are loaded, so setting it on a host that never
  # loads them fails with "unknown oid" while protecting nothing. Not loading
  # dtrace is the control.

# bsdinstall calls this random_pid. Persisted for the next boot and applied now
# only when it is still off, because a live readback never matches what you set.
sysctl_hardening_randompid: true
