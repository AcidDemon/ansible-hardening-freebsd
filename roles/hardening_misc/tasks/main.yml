---
- name: Disable core dumps
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "0"
    sysctl_file: /etc/sysctl.conf
    sysctl_set: true
    state: present
    reload: false
  loop:
    - kern.coredump
    - kern.sugid_coredump
  when: hardening_misc_coredumps | bool

- name: Restrict cron and at to allowlists
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "{{ (['root', admin_user, deploy_user] + hardening_misc_cron_allow_extra_users) | join('\n') }}\n"
    owner: root
    group: wheel
    mode: "0644"
  loop:
    - /var/cron/allow
    - /var/at/at.allow
  when: hardening_misc_cron_allow | bool

- name: Point root mail at the admin address
  ansible.builtin.lineinfile:
    path: /etc/mail/aliases
    regexp: '^root:'
    line: "root: {{ admin_email }}"
    create: true
    owner: root
    group: wheel
    mode: "0644"
  # Skipped when admin_email is still the default. FreeBSD 14+ delivers through
  # dma(8), which resolves "root: root" as a self-referential alias and drops the
  # message with "sendmail: no recipients" - silently killing every periodic
  # report and every cron mail on the box. With no alias at all, root's mail goes
  # to /var/mail/root as it should.
  when:
    - hardening_misc_mail | bool
    - admin_email != 'root'
  notify: Rebuild aliases

- name: External SMTP relay via msmtp (opt-in)
  when: hardening_misc_msmtp | bool
  block:
    - name: Install msmtp
      community.general.pkgng:
        name: msmtp
        state: present

    - name: Deploy msmtprc
      ansible.builtin.template:
        src: msmtprc.j2
        dest: /usr/local/etc/msmtprc
        owner: root
        group: wheel
        mode: "0600"

    - name: Deploy the msmtp alias map
      ansible.builtin.template:
        src: msmtp-aliases.j2
        dest: /usr/local/etc/aliases
        owner: root
        group: wheel
        mode: "0644"

    - name: Check the msmtp configuration before making it the system mailer
      ansible.builtin.command: msmtp --pretend --file=/usr/local/etc/msmtprc
      register: _msmtp_check
      changed_when: false
      failed_when: _msmtp_check.rc != 0

    # Installing msmtp changes nothing on its own: FreeBSD 14+ ships dma(8) as
    # the mailer and mailer.conf is what decides. Without this the relay is
    # configured, unused, and every report still goes to dma.
    - name: Route the system mailer through msmtp
      ansible.builtin.copy:
        dest: /etc/mail/mailer.conf
        content: |
          # Managed by Ansible
          sendmail	/usr/local/bin/msmtp
          send-mail	/usr/local/bin/msmtp
          # msmtp has no queue and no alias database, so these two have nothing
          # to do. true keeps callers such as newaliases(1) from failing.
          mailq	/usr/bin/true
          newaliases	/usr/bin/true
        owner: root
        group: wheel
        mode: "0644"
        backup: true

- name: Use a noexec tmpfs /tmp (opt-in; applies on reboot)
  when: hardening_misc_tmp_noexec | bool
  block:
    - name: Add a noexec tmpfs /tmp entry to fstab
      ansible.posix.mount:
        path: /tmp
        src: tmpfs
        fstype: tmpfs
        opts: "rw,mode=1777,nosuid,nodev,noexec"
        state: present

# bsdinstall calls this clear_tmp. Independent of the tmpfs option above: a
# tmpfs /tmp is empty after a reboot anyway, but a disk-backed /tmp is not, and
# that is the case where clearing it actually does something.
- name: Clear /tmp on boot
  community.general.sysrc:
    name: clear_tmp_enable
    value: "YES"
  when: hardening_misc_clear_tmp | bool
